name: Build, Test, and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: MoleculeLab-Linux-x64
          - os: windows-latest
            rid: win-x64
            artifact_name: MoleculeLab-Windows-x64
          - os: macos-latest
            rid: osx-arm64
            artifact_name: MoleculeLab-macOS-AppleSilicon
          - os: macos-latest
            rid: osx-x64
            artifact_name: MoleculeLab-macOS-Intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Módosítsd '9.0.x'-re vagy '10.0.x'-re, ha újabb .NET-et használsz

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Run tests (if test project exists)
        run: dotnet test --configuration Release --no-build || echo "No test projects found, skipping tests."

      - name: Publish self-contained executable
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish/${{ matrix.artifact_name }}

      - name: Package artifact (ZIP)
        shell: bash
        run: |
          cd ./publish
          zip -r ../${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  create-release:
    name: Create GitHub Release
    needs: build-and-test
    # Csak akkor fut le, ha egy verzió taget (pl. v1.0.0) tolsz fel GitHubra
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Flatten artifacts directory for release
        run: |
          mkdir -p ./release-files
          find ./artifacts -name "*.zip" -exec cp {} ./release-files/ \;

      - name: Create GitHub Release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-files/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}